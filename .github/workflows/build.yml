name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            args: --bundles deb,appimage
          - os: windows-latest
            name: windows
            args: --bundles nsis,msi
          - os: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: macOS architecture targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test -p grim-core --all-features --locked
      - run: npm run package -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: grim-dawn-trainer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/universal-apple-darwin/release/bundle/**/*.dmg
