name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            args: --bundles deb,appimage
          - os: windows-latest
            name: windows
            args: --bundles nsis,msi
          - os: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: macOS architecture targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test -p grim-core --all-features --locked
      - run: npm run package -- ${{ matrix.args }}
      - name: Linux portable zip
        if: runner.os == 'Linux'
        run: python3 scripts/package-source.py && python3 scripts/package-linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: grim-dawn-trainer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            release/*-linux-x86_64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect files and checksums
        run: |
          mkdir upload
          find artifacts -type f -exec sh -c 'cp "$1" "upload/$(basename "$1" | tr " " "-")"' _ {} \;
          cd upload && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" upload/* --title "Grim Dawn Trainer $GITHUB_REF_NAME" --notes-file .github/release-notes.md
