[package]
name = "grim-dawn-trainer"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Cross-platform Grim Dawn trainer and character editor"
authors = ["Grim Dawn Trainer contributors"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
grim-core = { path = "../crates/grim-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
